[project]
name = "tlc-demand"
version = "0.1.0"
description = "Zone-level 15-minute taxi demand forecasting with leakage-safe features and a rolling-origin backtest."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "lightgbm>=4.5",
  "onnxruntime>=1.18",
  "fastapi>=0.115",
  "pydantic>=2.7",
  "prometheus-client>=0.20",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "onnxmltools>=1.12", "skl2onnx>=1.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".venv", "gateway"]
line-length = 120

[tool.ruff.lint]
# Unused names, undefined names, syntax errors and bare-except style problems. Import ordering and
# line length are left alone on purpose.
select = ["E4", "E7", "E9", "F"]
